[package]
name = "vorsorgeordner"
version = "0.1.0"
description = "Vorsorgeordner: Verträge, Versicherungen und wichtige Hinweise für die Familie"
edition = "2021"
rust-version = "1.90"

[lib]
name = "vorsorgeordner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
age = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
